<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Agenet</title>
  <meta name="description" content="Reset your Agenet account password securely." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/forms.css" />
</head>
<body>
  <div id="site-navbar"></div>
  <main class="main-page">
    <section class="page-shell">
      <div class="container">
        <div class="auth-card">
          <div class="brand"><a href="../index.html">Agenet</a></div>
          <h2>Reset your password</h2>
          <p class="text-muted">We’ll send a secure reset link to your email.</p>
          <form class="forgot-password-form" data-form-type="forgot-password">
            <div class="form-group">
              <label class="form-label" for="reset-email">Email</label>
              <input id="reset-email" class="form-control" type="email" placeholder="you@example.com" required />
            </div>
            <button class="btn btn-primary w-100" type="submit">Send reset link</button>
            <div class="form-status" aria-live="polite"></div>
          </form>
          <div class="inline-meta mt-4">
            <a href="login.html">Back to sign in</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/footer.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
