<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Agenet</title>
  <meta name="description" content="Contact Agenet for strategy calls and project inquiries." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/forms.css" />
</head>
<body>
  <div id="site-navbar"></div>
  <main class="main-page">
    <header class="page-header">
      <div class="container">
        <div class="eyebrow">Contact</div>
        <h1>Tell us about your next initiative.</h1>
        <p class="subcopy">We respond about new requests within one business day.</p>
      </div>
    </header>

    <section class="page-shell">
      <div class="container">
        <div class="row g-5">
          <div class="col-lg-5">
            <div class="content-panel">
              <h3>Reach out</h3>
              <p class="text-muted">hello@agenet.studio</p>
              <p class="text-muted">+91 98765 43210</p>
              <p class="text-muted">Bengaluru, India</p>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="auth-card">
              <form class="contact-form" data-form-type="contact">
                <div class="form-group">
                  <label class="form-label" for="name">Full name</label>
                  <input id="name" class="form-control" type="text" placeholder="Your name" required />
                </div>
                <div class="form-group">
                  <label class="form-label" for="email">Email</label>
                  <input id="email" class="form-control" type="email" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                  <label class="form-label" for="message">Project brief</label>
                  <textarea id="message" class="form-control" placeholder="Tell us what you're building..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Send inquiry</button>
                <div class="form-status" aria-live="polite"></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/footer.js"></script>
  <script src="../js/forms.js"></script>
</body>
</html>
