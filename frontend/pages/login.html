<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Agenet</title>
  <meta name="description" content="Login to your Agenet account to manage projects, billing, and membership." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/forms.css" />
</head>
<body>
  <div id="site-navbar"></div>
  <main class="main-page">
    <section class="page-shell">
      <div class="container">
        <div class="auth-card">
          <div class="brand"><a href="../index.html">Agenet</a></div>
          <h2>Welcome back</h2>
          <p class="text-muted">Sign in to manage your account and projects.</p>
          <form class="login-form" data-form-type="login">
            <div class="form-group">
              <label class="form-label" for="login-email">Email</label>
              <input id="login-email" class="form-control" type="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="login-password">Password</label>
              <input id="login-password" class="form-control" type="password" placeholder="Enter your password" required />
            </div>
            <div class="auth-actions">
              <label class="form-check">
                <input type="checkbox" class="form-check-input" />
                <span class="form-check-label">Remember me</span>
              </label>
              <a href="forgot-password.html">Forgot password?</a>
            </div>
            <button class="btn btn-primary w-100 mt-3" type="submit">Sign in</button>
            <div class="form-status" aria-live="polite"></div>
          </form>
          <div class="inline-meta mt-4">
            <span>Need an account?</span>
            <a href="register.html">Create one</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/footer.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
