<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start a Project | Agenet</title>
  <meta name="description" content="Start a project with Agenet and share your brief, goals, and timeline." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/forms.css" />
</head>
<body>
  <div id="site-navbar"></div>
  <main class="main-page">
    <header class="page-header">
      <div class="container">
        <div class="eyebrow">Start a project</div>
        <h1>Share your brief and we’ll shape the next step.</h1>
        <p class="subcopy">Tell us what you're building and we’ll follow up with the right scope, timeline, and pricing model.</p>
      </div>
    </header>

    <section class="page-shell">
      <div class="container">
        <div class="auth-card">
          <form class="inquiry-form" data-form-type="inquiry">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="project-name">Name</label>
                <input id="project-name" class="form-control" type="text" placeholder="Full name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="project-email">Email</label>
                <input id="project-email" class="form-control" type="email" placeholder="you@example.com" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="project-budget">Budget range</label>
                <select id="project-budget" class="form-select">
                  <option>$1k–5k</option>
                  <option>$5k–15k</option>
                  <option>$15k–30k</option>
                  <option>$30k+</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="project-type">Service type</label>
                <select id="project-type" class="form-select">
                  <option>Brand + design</option>
                  <option>Website build</option>
                  <option>Product design</option>
                  <option>Growth system</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label" for="project-brief">Project brief</label>
                <textarea id="project-brief" class="form-control" placeholder="Describe goals, current challenges, and your timeline"></textarea>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-4">Send project request</button>
            <div class="form-status" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/footer.js"></script>
  <script src="../js/forms.js"></script>
</body>
</html>
