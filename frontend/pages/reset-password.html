<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Pravyuk</title>
  <meta name="description" content="Set a new secure password for your Pravyuk client account." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <!-- Favicon & Brand Icons -->
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png" />
  <link rel="shortcut icon" href="../favicon.ico" />
</head>
<body>
  <div id="site-navbar"></div>
  <main class="main-page">
    <section class="page-shell py-5">
      <div class="container">
        <div class="auth-card mx-auto shadow-lg" style="max-width: 480px;">
          <div class="brand"><a href="../index.html">Pravyuk</a></div>
          <h2 class="text-white fw-bold mb-1">Set new password</h2>
          <p class="text-muted small mb-4">Choose a strong password containing at least 8 characters.</p>

          <form class="reset-password-form">
            <input type="hidden" id="reset-token" />
            <div class="form-group mb-3">
              <label class="form-label text-muted small" for="new-password">New password</label>
              <input id="new-password" class="form-control" type="password" placeholder="At least 8 characters" minlength="8" required />
            </div>
            <div class="form-group mb-4">
              <label class="form-label text-muted small" for="confirm-password">Confirm new password</label>
              <input id="confirm-password" class="form-control" type="password" placeholder="Repeat your new password" minlength="8" required />
            </div>

            <button class="btn btn-primary w-100" type="submit">Update password</button>
            <div class="form-status mt-3" aria-live="polite"></div>
          </form>

          <div class="inline-meta mt-4 text-center">
            <a href="login.html" class="text-muted small"><i class="bi bi-arrow-left me-1"></i> Back to sign in</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/footer.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
