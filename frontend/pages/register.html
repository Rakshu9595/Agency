<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Agenet</title>
  <meta name="description" content="Create an Agenet account to manage your projects and billing." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/forms.css" />
</head>
<body>
  <div id="site-navbar"></div>
  <main class="main-page">
    <section class="page-shell">
      <div class="container">
        <div class="auth-card">
          <div class="brand"><a href="../index.html">Agenet</a></div>
          <h2>Create your account</h2>
          <p class="text-muted">Start managing strategy calls, billing, and memberships securely.</p>
          <form class="register-form" data-form-type="register">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="register-first-name">First name</label>
                <input id="register-first-name" class="form-control" type="text" placeholder="First name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="register-last-name">Last name</label>
                <input id="register-last-name" class="form-control" type="text" placeholder="Last name" required />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="register-email">Email</label>
              <input id="register-email" class="form-control" type="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="register-password">Password</label>
              <input id="register-password" class="form-control" type="password" placeholder="Create a password" required />
            </div>
            <label class="form-check">
              <input type="checkbox" class="form-check-input" required />
              <span class="form-check-label">I agree to the terms and privacy policy.</span>
            </label>
            <button class="btn btn-primary w-100" type="submit">Create account</button>
            <div class="form-status" aria-live="polite"></div>
          </form>
          <div class="inline-meta mt-4">
            <span>Already have an account?</span>
            <a href="login.html">Sign in</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/footer.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
